<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="52%" stop-color="#0E1630"/>
      <stop offset="100%" stop-color="#14112B"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 170) rotate(25) scale(340 220)">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 120) rotate(-18) scale(360 240)">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="120" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="28%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="72%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="360" y1="90" x2="960" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="90" y1="60" x2="290" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="20" fill="url(#glowCyan)"/>
  <rect width="1280" height="340" rx="20" fill="url(#glowViolet)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="338.5" rx="19.25" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Left geometric wireframe wolf/fox avatar emblem -->
  <g transform="translate(88, 52)">
    <circle cx="116" cy="118" r="102" fill="#0B1226" fill-opacity="0.72" stroke="url(#wireGrad)" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="116" cy="118" r="88" stroke="#38BDF8" stroke-opacity="0.16" stroke-dasharray="4 6" stroke-width="1.2"/>
    <!-- Ears -->
    <polygon points="56,102 68,36 102,76" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="176,102 164,36 130,76" fill="#A855F7" fill-opacity="0.10" stroke="#C084FC" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner ears -->
    <polygon points="68,94 74,52 94,78" stroke="#7DD3FC" stroke-opacity="0.65" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="164,94 158,52 138,78" stroke="#D8B4FE" stroke-opacity="0.65" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Head wireframe -->
    <polygon points="102,76 130,76 176,102 164,154 116,192 68,154 56,102" fill="#0F172A" fill-opacity="0.75" stroke="url(#wireGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Facets & mesh topology -->
    <path d="M56 102 L116 118 L176 102 M102 76 L116 118 L130 76 M68 154 L116 146 L164 154 M116 118 L116 192 M68 154 L116 118 L164 154" stroke="#64748B" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Eyes -->
    <polygon points="78,120 99,115 96,129 82,128" fill="#22D3EE"/>
    <polygon points="154,120 133,115 136,129 150,128" fill="#C084FC"/>
    <!-- Nose & vertex nodes -->
    <polygon points="116,156 109,147 123,147" fill="#E2E8F0"/>
    <circle cx="68" cy="36" r="3" fill="#38BDF8"/>
    <circle cx="164" cy="36" r="3" fill="#C084FC"/>
    <circle cx="116" cy="192" r="3" fill="#93C5FD"/>
    <circle cx="56" cy="102" r="2.5" fill="#38BDF8"/>
    <circle cx="176" cy="102" r="2.5" fill="#C084FC"/>
  </g>

  <!-- Node-graph decorative circuit on right -->
  <g opacity="0.45">
    <path d="M1040 82 H1120 L1146 108 H1208" stroke="#38BDF8" stroke-width="1.3"/>
    <path d="M1068 258 H1136 L1162 232 H1214" stroke="#A855F7" stroke-width="1.3"/>
    <circle cx="1040" cy="82" r="3.5" fill="#38BDF8"/>
    <circle cx="1208" cy="108" r="3.5" fill="#38BDF8"/>
    <circle cx="1068" cy="258" r="3.5" fill="#A855F7"/>
    <circle cx="1214" cy="232" r="3.5" fill="#A855F7"/>
  </g>

  <!-- Pill badge -->
  <g transform="translate(360, 62)">
    <rect width="268" height="28" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#22D3EE"/>
    <text x="32" y="18.5" fill="#BAE6FD" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.06em">AGENT SKILL · VRCHAT AVATAR</text>
  </g>

  <!-- Title -->
  <text x="360" y="148" fill="url(#titleGrad)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.02em">luzzy-vrchat</text>

  <!-- Subtitle -->
  <text x="360" y="186" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="18.5" font-weight="500">Evidence-Driven Unity &amp; Modular Avatar Knowledge Base for AI Coding Agents</text>
  <text x="360" y="213" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="15.5">面向 AI Agent 的 VRChat Avatar 改模实战知识库（Unity 2022 · Modular Avatar · NDMF · VRCFT · SDK）</text>

  <!-- Accent divider -->
  <rect x="360" y="236" width="660" height="1.5" fill="url(#accentLine)"/>

  <!-- Stat chips -->
  <g transform="translate(360, 256)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="128" height="32" rx="8" fill="#1E293B" fill-opacity="0.82" stroke="#334155"/>
    <text x="14" y="20" fill="#38BDF8">66</text>
    <text x="36" y="20" fill="#E2E8F0">References</text>

    <rect x="140" y="0" width="136" height="32" rx="8" fill="#1E293B" fill-opacity="0.82" stroke="#334155"/>
    <text x="154" y="20" fill="#A855F7">00–07</text>
    <text x="196" y="20" fill="#E2E8F0">Domains</text>

    <rect x="288" y="0" width="154" height="32" rx="8" fill="#1E293B" fill-opacity="0.82" stroke="#334155"/>
    <text x="302" y="20" fill="#34D399">6</text>
    <text x="316" y="20" fill="#E2E8F0">Ironclad Rules</text>

    <rect x="454" y="0" width="166" height="32" rx="8" fill="#1E293B" fill-opacity="0.82" stroke="#334155"/>
    <text x="468" y="20" fill="#FBBF24">177+</text>
    <text x="504" y="20" fill="#E2E8F0">Field Rounds</text>
  </g>
</svg>
